<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Who should get tested genetic nephrology infographic</title>
  <desc id="desc">Red flags indications for genetic testing map with central node and surrounding risk domains.</desc>
  <defs>
    <style>
      .label { font-family: 'Inter', Arial, sans-serif; font-size: 26px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .label-sm { font-family: 'Inter', Arial, sans-serif; font-size: 22px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #475569; stroke-width: 3; }
      .node { stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>

  <!-- connecting lines -->
  <line class="line" x1="800" y1="430" x2="470" y2="340"/>
  <line class="line" x1="800" y1="430" x2="590" y2="560"/>
  <line class="line" x1="800" y1="430" x2="1060" y2="560"/>
  <line class="line" x1="800" y1="430" x2="1130" y2="350"/>
  <line class="line" x1="470" y1="340" x2="300" y2="210"/>
  <line class="line" x1="470" y1="340" x2="460" y2="170"/>
  <line class="line" x1="470" y1="340" x2="250" y2="360"/>
  <line class="line" x1="470" y1="340" x2="350" y2="490"/>
  <line class="line" x1="590" y1="560" x2="380" y2="690"/>
  <line class="line" x1="590" y1="560" x2="560" y2="740"/>
  <line class="line" x1="590" y1="560" x2="760" y2="730"/>
  <line class="line" x1="1060" y1="560" x2="940" y2="720"/>
  <line class="line" x1="1060" y1="560" x2="1160" y2="720"/>
  <line class="line" x1="1060" y1="560" x2="1320" y2="620"/>
  <line class="line" x1="1130" y1="350" x2="1280" y2="220"/>
  <line class="line" x1="1130" y1="350" x2="1400" y2="330"/>
  <line class="line" x1="1130" y1="350" x2="1270" y2="430"/>

  <!-- central node -->
  <circle class="node" filter="url(#softShadow)" cx="800" cy="430" r="112" fill="#fde047"/>
  <text class="label" x="800" y="388">Red Flags:</text>
  <text class="label" x="800" y="424">Indications for</text>
  <text class="label" x="800" y="460">Genetic Testing</text>

  <!-- domain nodes -->
  <circle class="node" filter="url(#softShadow)" cx="470" cy="340" r="104" fill="#f9a8d4"/>
  <text class="label" x="470" y="320">Unusual</text>
  <text class="label" x="470" y="352">Clinical</text>
  <text class="label" x="470" y="384">Course</text>

  <circle class="node" filter="url(#softShadow)" cx="590" cy="560" r="108" fill="#d8b4fe"/>
  <text class="label" x="590" y="540">Family</text>
  <text class="label" x="590" y="572">History</text>

  <circle class="node" filter="url(#softShadow)" cx="1060" cy="560" r="106" fill="#a5f3fc"/>
  <text class="label" x="1060" y="540">Concern for</text>
  <text class="label" x="1060" y="572">Specific Genetic</text>
  <text class="label" x="1060" y="604">Condition</text>

  <circle class="node" filter="url(#softShadow)" cx="1130" cy="350" r="116" fill="#93c5fd"/>
  <text class="label" x="1130" y="330">Kidney</text>
  <text class="label" x="1130" y="362">Disease</text>
  <text class="label" x="1130" y="394">Subtype</text>

  <!-- surrounding detail nodes -->
  <circle class="node" cx="300" cy="210" r="72" fill="#fbcfe8"/>
  <text class="label-sm" x="300" y="194">Rapid</text>
  <text class="label-sm" x="300" y="224">Progression</text>

  <circle class="node" cx="460" cy="170" r="64" fill="#fbcfe8"/>
  <text class="label-sm" x="460" y="170">Young Age</text>

  <circle class="node" cx="250" cy="360" r="74" fill="#fbcfe8"/>
  <text class="label-sm" x="250" y="344">Severe</text>
  <text class="label-sm" x="250" y="374">Presentation</text>

  <circle class="node" cx="350" cy="490" r="88" fill="#e9d5ff"/>
  <text class="label-sm" x="350" y="466">Syndromic</text>
  <text class="label-sm" x="350" y="494">Features in</text>
  <text class="label-sm" x="350" y="522">Family</text>

  <circle class="node" cx="380" cy="690" r="78" fill="#e9d5ff"/>
  <text class="label-sm" x="380" y="672">Suspicion of</text>
  <text class="label-sm" x="380" y="700">X-linked</text>

  <circle class="node" cx="560" cy="740" r="84" fill="#e9d5ff"/>
  <text class="label-sm" x="560" y="718">Autosomal</text>
  <text class="label-sm" x="560" y="746">Recessive</text>

  <circle class="node" cx="760" cy="730" r="82" fill="#e9d5ff"/>
  <text class="label-sm" x="760" y="710">Autosomal</text>
  <text class="label-sm" x="760" y="738">Dominant</text>

  <circle class="node" cx="940" cy="720" r="80" fill="#bae6fd"/>
  <text class="label-sm" x="940" y="702">Based on</text>
  <text class="label-sm" x="940" y="730">Clinical</text>

  <circle class="node" cx="1160" cy="720" r="76" fill="#bae6fd"/>
  <text class="label-sm" x="1160" y="704">Based on</text>
  <text class="label-sm" x="1160" y="732">Biopsy</text>

  <circle class="node" cx="1320" cy="620" r="90" fill="#bae6fd"/>
  <text class="label-sm" x="1320" y="602">Patterns of</text>
  <text class="label-sm" x="1320" y="632">Electrolyte</text>

  <circle class="node" cx="1280" cy="220" r="76" fill="#bbf7d0"/>
  <text class="label-sm" x="1280" y="202">Polycystic</text>
  <text class="label-sm" x="1280" y="230">Kidney</text>

  <circle class="node" cx="1400" cy="330" r="62" fill="#93c5fd"/>
  <text class="label-sm" x="1400" y="330">Unknown</text>

  <circle class="node" cx="1270" cy="430" r="56" fill="#93c5fd"/>
  <text class="label-sm" x="1270" y="430">FSGS</text>
</svg>

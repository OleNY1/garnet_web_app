<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GARNET</title>
    <!--
      GitHub Pages is a static host: a direct visit or refresh on a real
      route like /garnet_web_app/learn has no matching file, so GitHub
      serves this 404 page. This script encodes the intended path into a
      query string and redirects to the app's index.html, which decodes it
      back (see the matching script in index.html) so React Router can pick
      up where the URL left off. One base-path segment: /garnet_web_app/.
    -->
    <script>
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        color: #16323b;
        background: #f6fafa;
      }
    </style>
  </head>
  <body>
    <p>Taking you to GARNET&hellip;</p>
  </body>
</html>

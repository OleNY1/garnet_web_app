<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GARNET is a patient education website created as part of a Columbia medical research project. Learn how genetic testing may help you or your family understand kidney disease."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6fafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1a1e" />
    <title>GARNET | Learn about genetic testing for kidney disease</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a color flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('garnet-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* fall back to light mode */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
